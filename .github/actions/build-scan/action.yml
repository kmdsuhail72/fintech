name: Build and scan application image
description: Build locally and reject HIGH/CRITICAL vulnerabilities before any registry publication.
inputs:
  service:
    description: Application service name
    required: true
  build-args:
    description: Optional Docker build arguments (public values only)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Docker build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: infrastructure/docker/${{ inputs.service }}.Dockerfile
        target: runtime
        platforms: linux/amd64
        load: true
        push: false
        tags: asteriq-ci/${{ inputs.service }}:${{ github.sha }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha,scope=asteriq-${{ inputs.service }}
        cache-to: type=gha,mode=max,scope=asteriq-${{ inputs.service }}
        provenance: false
    - name: Container vulnerability gate
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.75.0
        image-ref: asteriq-ci/${{ inputs.service }}:${{ github.sha }}
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: 'false'
        exit-code: '1'
        format: json
        output: image-security-${{ inputs.service }}.json
        timeout: 10m
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      if: always()
      with:
        name: image-security-${{ inputs.service }}
        path: image-security-${{ inputs.service }}.json
        if-no-files-found: warn
        retention-days: 14
