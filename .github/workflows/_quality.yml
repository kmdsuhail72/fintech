name: Shared quality gates
on:
  workflow_call:
permissions:
  contents: read
jobs:
  gitops:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Helm/GitOps test tooling
        run: python -m pip install -r scripts/kubernetes/requirements.txt -r apps/ai-service/requirements-dev.txt -r scripts/monitoring/requirements-test.txt
      - name: Validate Argo policies and Helm/promotion behavior without cloud credentials
        run: |
          helm version --short
          python scripts/gitops/validate.py --root gitops
          python -m pytest scripts/helm/tests scripts/gitops/tests scripts/monitoring/tests -q -p no:cacheprovider
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://asteriq_ci:ci_only_password@localhost:5432/asteriq_ci
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-signing-secret-at-least-32-characters
      TEST_DATABASE_URL: postgresql://asteriq_ci:ci_only_password@localhost:5432/asteriq_ci
      TEST_REDIS_URL: redis://localhost:6379
      ALERT_TEST_DATABASE_URL: postgresql://asteriq_ci:ci_only_password@localhost:5432/asteriq_ci
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: asteriq_ci
          POSTGRES_USER: asteriq_ci
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U asteriq_ci -d asteriq_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: TypeScript checks
        run: npm run typecheck
      - name: Install extensions in the shared public schema
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$POSTGRES_CONTAINER" psql -U asteriq_ci -d asteriq_ci -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public; CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;'
      - name: Unit and database integration tests
        run: npm test
      - name: Docker configuration and migration tests
        run: npm run test:docker
      - name: Application production build
        run: npm run build
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAG_TEST_DATABASE_URL: postgresql://asteriq_ci:ci_only_password@localhost:5432/asteriq_ci
      NEWS_SENTIMENT_ENABLED: 'false'
      PYTHONPATH: apps/ai-service
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: asteriq_ci
          POSTGRES_USER: asteriq_ci
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U asteriq_ci -d asteriq_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai-service/requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r apps/ai-service/requirements.txt -r apps/ai-service/requirements-assistant.txt -r apps/ai-service/requirements-rag.txt -r apps/ai-service/requirements-dev.txt
      - name: Python syntax and critical lint
        run: |
          python -m compileall -q apps/ai-service/app
          python -m ruff check apps/ai-service/app apps/ai-service/tests scripts/ci --select E9,F63,F7,F82
      - name: Python tests including pgvector integration
        run: python -m pytest apps/ai-service/tests scripts/ci/tests -q -p no:cacheprovider --junitxml=python-results.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: python-test-results
          path: python-results.xml
          if-no-files-found: warn
          retention-days: 14
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Repository dependency and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: repository-security.json
          skip-dirs: .git,.runtime,.venv,node_modules,apps/ai-service/artifacts
          timeout: 10m
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: repository-security-report
          path: repository-security.json
          if-no-files-found: warn
          retention-days: 14
