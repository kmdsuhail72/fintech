nameOverride: ''
fullnameOverride: ''
replicaCount: 3
image:
  repository: asteriq/web
  tag: 0.1.0
  digest: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []
service:
  type: ClusterIP
  port: 8080
  containerPort: 8080
serviceAccount:
  create: true
  name: ''
  annotations: {}
  automountServiceAccountToken: false
env:
  API_UPSTREAM: http://api-asteriq-api:3000
extraEnv: []
existingSecrets: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
podAnnotations: {}
nodeSelector:
  kubernetes.io/arch: amd64
  kubernetes.io/os: linux
tolerations: []
scheduling:
  podAntiAffinity: true
  zoneSpread: false
revisionHistoryLimit: 5
minReadySeconds: 10
progressDeadlineSeconds: 600
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
terminationGracePeriodSeconds: 180
preStopDelaySeconds: 35
tmpSizeLimit: 128Mi
probes:
  startup:
    enabled: true
    httpGet:
      path: /health
      port: http
    timeoutSeconds: 3
    periodSeconds: 5
    failureThreshold: 60
  readiness:
    enabled: true
    httpGet:
      path: /health
      port: http
    timeoutSeconds: 3
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    httpGet:
      path: /health
      port: http
    timeoutSeconds: 3
    periodSeconds: 10
    failureThreshold: 3
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
  targetMemoryUtilizationPercentage: 80
  additionalMetrics: []
pdb:
  enabled: true
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
ingress:
  enabled: false
  className: alb
  annotations: {}
  hosts: []
  tls: []
rdsCa:
  enabled: false
  existingConfigMap: rds-ca
extraVolumes: []
extraVolumeMounts: []
