apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "asteriq-api.fullname" . }}-config
  labels:
    {{- include "asteriq-api.labels" . | nindent 4 }}
data:
  {{- range $key, $value := omit .Values.env "API_PORT" "NODE_EXTRA_CA_CERTS" "DEV_AUTH_TOKEN_OUTPUT" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if eq "api" "api" }}
  API_PORT: {{ .Values.service.containerPort | quote }}
  {{- if .Values.rdsCa.enabled }}
  NODE_EXTRA_CA_CERTS: /etc/rds-ca/global-bundle.pem
  {{- end }}
  {{- end }}
{{- if eq "api" "frontend" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "asteriq-api.fullname" . }}-nginx
  labels:
    {{- include "asteriq-api.labels" . | nindent 4 }}
data:
  nginx.conf.template: |
    {{- .Files.Get "files/nginx.conf.template" | replace "__ASTERIQ_LISTEN_PORT__" (toString .Values.service.containerPort) | nindent 4 }}
{{- end }}
