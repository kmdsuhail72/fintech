apiVersion: v2
name: asteriq-platform
description: Asteriq AI web, Node API and FastAPI umbrella chart
type: application
version: 0.2.1
appVersion: 0.1.0
kubeVersion: '>=1.31.0-0'
dependencies:
  - name: asteriq-web
    version: 0.1.1
    repository: file://../asteriq-web
    condition: asteriq-web.enabled
  - name: asteriq-api
    version: 0.1.0
    repository: file://../asteriq-api
    condition: asteriq-api.enabled
  - name: asteriq-ai-service
    version: 0.1.0
    repository: file://../asteriq-ai-service
    condition: asteriq-ai-service.enabled
