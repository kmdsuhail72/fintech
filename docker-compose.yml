name: asteriq-ai

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 45s
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asteriq}
      POSTGRES_USER: ${POSTGRES_USER:-asteriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asteriq_local_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  ai-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/ai-service.Dockerfile
      target: runtime
      args:
        INSTALL_NEWS_NLP: ${INSTALL_NEWS_NLP:-false}
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RESEARCH_BACKEND_URL: http://api:3000/api/v1
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-asteriq}:${POSTGRES_PASSWORD:-asteriq_local_only}@postgres:5432/${POSTGRES_DB:-asteriq}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_RESEARCH_MODEL: ${OPENAI_RESEARCH_MODEL:-gpt-4.1-mini}
      RESEARCH_ASSISTANT_ENABLED: ${RESEARCH_ASSISTANT_ENABLED:-true}
      NEWS_SENTIMENT_ENABLED: ${INSTALL_NEWS_NLP:-false}
      NEWS_SENTIMENT_LOCAL_FILES_ONLY: ${NEWS_SENTIMENT_LOCAL_FILES_ONLY:-true}
      NEWS_SENTIMENT_CACHE_DIR: /app/artifacts/huggingface
    volumes:
      - ai-artifacts:/app/artifacts
    networks: [application, data]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    environment:
      NODE_ENV: development
      API_PORT: 3000
      AI_SERVICE_URL: http://ai-service:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-asteriq}:${POSTGRES_PASSWORD:-asteriq_local_only}@postgres:5432/${POSTGRES_DB:-asteriq}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-docker-secret-change-before-production-32chars}
      JWT_ISSUER: ${JWT_ISSUER:-asteriq-ai}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-asteriq-clients}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost:8081}
      AUTH_WEB_URL: ${AUTH_WEB_URL:-http://localhost:8080}
      SMTP_URL: ${SMTP_URL:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      DEV_AUTH_TOKEN_OUTPUT: ${DEV_AUTH_TOKEN_OUTPUT:-true}
      ALERT_WORKERS_ENABLED: ${ALERT_WORKERS_ENABLED:-true}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    networks: [application, data]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  web:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: runtime
      args:
        VITE_API_URL: /api/v1
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    networks: [application]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  application:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  ai-artifacts:
