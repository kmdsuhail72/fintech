apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: asteriq-staging
  namespace: argocd
spec:
  description: Asteriq staging application tier only
  sourceRepos:
    - https://github.com/REPLACE_OWNER/REPLACE_APPLICATION_REPOSITORY.git
    - https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPOSITORY.git
  destinations:
    - server: https://REPLACE_STAGING_EKS_API_SERVER
      namespace: asteriq-staging
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: ServiceAccount
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress
    - group: batch
      kind: Job
  orphanedResources:
    warn: true
  roles:
    - name: observer
      groups:
        - asteriq-staging-readers
      policies:
        - p, proj:asteriq-staging:observer, applications, get, asteriq-staging/*, allow
    - name: release-manager
      groups:
        - asteriq-staging-release-managers
      policies:
        - p, proj:asteriq-staging:release-manager, applications, get, asteriq-staging/*,
          allow
        - p, proj:asteriq-staging:release-manager, applications, sync, asteriq-staging/*,
          allow
