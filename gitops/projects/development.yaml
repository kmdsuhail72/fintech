apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: asteriq-development
  namespace: argocd
spec:
  description: Asteriq development application tier only
  sourceRepos:
    - https://github.com/REPLACE_OWNER/REPLACE_APPLICATION_REPOSITORY.git
    - https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPOSITORY.git
  destinations:
    - server: https://REPLACE_DEVELOPMENT_EKS_API_SERVER
      namespace: asteriq-dev
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: ServiceAccount
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress
    - group: batch
      kind: Job
  orphanedResources:
    warn: true
  roles:
    - name: observer
      groups:
        - asteriq-development-readers
      policies:
        - p, proj:asteriq-development:observer, applications, get, asteriq-development/*,
          allow
    - name: release-manager
      groups:
        - asteriq-development-release-managers
      policies:
        - p, proj:asteriq-development:release-manager, applications, get, asteriq-development/*,
          allow
        - p, proj:asteriq-development:release-manager, applications, sync, asteriq-development/*,
          allow
