apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asteriq-development
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: asteriq
    asteriq.ai/environment: development
spec:
  project: asteriq-development
  sources:
    - repoURL: https://github.com/REPLACE_OWNER/REPLACE_APPLICATION_REPOSITORY.git
      targetRevision: REPLACE_APPROVED_APPLICATION_COMMIT
      path: helm/asteriq-platform
      helm:
        releaseName: asteriq
        valueFiles:
          - values-dev.yaml
          - $values/environments/development/values.yaml
    - repoURL: https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPOSITORY.git
      targetRevision: main
      ref: values
  destination:
    server: https://REPLACE_DEVELOPMENT_EKS_API_SERVER
    namespace: asteriq-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - PrunePropagationPolicy=foreground
      - FailOnSharedResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
  revisionHistoryLimit: 10
