apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.argoproj.io_Application: "hs = {status = \"Progressing\"\
    , message = \"Waiting for child sync and health\"}\nif obj.status ~= nil then\n\
    \  if obj.status.health ~= nil and obj.status.health.status == \"Degraded\" then\n\
    \    hs.status = \"Degraded\"\n  elseif obj.status.sync ~= nil and obj.status.sync.status\
    \ == \"Synced\" and obj.status.health ~= nil and obj.status.health.status == \"\
    Healthy\" then\n    hs.status = \"Healthy\"\n    hs.message = \"Child is synced\
    \ and healthy\"\n  end\nend\nreturn hs\n"
