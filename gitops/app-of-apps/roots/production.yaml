apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asteriq-root-production
  namespace: argocd
spec:
  project: asteriq-root-production
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPOSITORY.git
    targetRevision: main
    path: app-of-apps/environments/production
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
