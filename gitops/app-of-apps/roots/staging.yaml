apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asteriq-root-staging
  namespace: argocd
spec:
  project: asteriq-root-staging
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPOSITORY.git
    targetRevision: main
    path: app-of-apps/environments/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
