apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: asteriq-platform-staging
  namespace: argocd
spec:
  description: 'Privileged cluster services: platform-admin reviewed only'
  sourceRepos:
  - https://github.com/REPLACE_OWNER/REPLACE_APPLICATION_REPOSITORY.git
  - https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPOSITORY.git
  - https://aws.github.io/eks-charts
  - https://charts.jetstack.io
  - https://prometheus-community.github.io/helm-charts
  - https://grafana-community.github.io/helm-charts
  - https://grafana.github.io/helm-charts
  destinations:
  - server: https://REPLACE_STAGING_EKS_API_SERVER
    namespace: monitoring
  - server: https://REPLACE_STAGING_EKS_API_SERVER
    namespace: cert-manager
  - server: https://REPLACE_STAGING_EKS_API_SERVER
    namespace: kube-system
  clusterResourceWhitelist:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
  - group: networking.k8s.io
    kind: IngressClass
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  orphanedResources:
    warn: true
