apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  project: asteriq-elk-dev
  destination:
    server: https://REPLACE_DEVELOPMENT_EKS_API_SERVER
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
  revisionHistoryLimit: 10
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_APPLICATION_REPOSITORY.git
    targetRevision: REPLACE_APPROVED_APPLICATION_COMMIT
    path: k8s/monitoring/elk/environments/dev
