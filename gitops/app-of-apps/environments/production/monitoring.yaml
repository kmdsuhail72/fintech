apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  project: asteriq-platform-production
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: REPLACE_APPROVED_CHART_VERSION
      helm:
        releaseName: asteriq-monitoring
        valueFiles:
          - $values/app-of-apps/values/production/monitoring.yaml
    - repoURL: https://github.com/REPLACE_OWNER/REPLACE_APPLICATION_REPOSITORY.git
      targetRevision: REPLACE_APPROVED_APPLICATION_COMMIT
      path: k8s/monitoring/prometheus
    - repoURL: https://github.com/REPLACE_OWNER/REPLACE_APPLICATION_REPOSITORY.git
      targetRevision: REPLACE_APPROVED_APPLICATION_COMMIT
      path: k8s/monitoring/grafana
    - repoURL: https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPOSITORY.git
      targetRevision: REPLACE_IMMUTABLE_VALUES_COMMIT
      ref: values
  destination:
    server: https://REPLACE_PRODUCTION_EKS_API_SERVER
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
