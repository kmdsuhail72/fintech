apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asteriq-ai-service-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: asteriq-split-production
  sources:
  - repoURL: https://github.com/REPLACE_OWNER/REPLACE_APPLICATION_REPOSITORY.git
    targetRevision: REPLACE_APPROVED_APPLICATION_COMMIT
    path: helm/asteriq-ai-service
    helm:
      releaseName: asteriq
      valueFiles:
      - $values/app-of-apps/values/production/asteriq-ai-service.yaml
  - repoURL: https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPOSITORY.git
    targetRevision: REPLACE_IMMUTABLE_VALUES_COMMIT
    ref: values
  destination:
    server: https://REPLACE_PRODUCTION_EKS_API_SERVER
    namespace: asteriq-production
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    - PruneLast=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
