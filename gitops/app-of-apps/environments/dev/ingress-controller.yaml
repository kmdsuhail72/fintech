apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-controller-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
spec:
  project: asteriq-platform-dev
  sources:
  - repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: REPLACE_APPROVED_CHART_VERSION
    helm:
      releaseName: aws-load-balancer-controller
      valueFiles:
      - $values/app-of-apps/values/dev/ingress-controller.yaml
  - repoURL: https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPOSITORY.git
    targetRevision: REPLACE_IMMUTABLE_VALUES_COMMIT
    ref: values
  destination:
    server: https://REPLACE_DEVELOPMENT_EKS_API_SERVER
    namespace: kube-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    - PruneLast=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
  revisionHistoryLimit: 10
