apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: asteriq-platform-staging
  sources:
  - repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: REPLACE_APPROVED_CHART_VERSION
    helm:
      releaseName: cert-manager
      valueFiles:
      - $values/app-of-apps/values/staging/cert-manager.yaml
  - repoURL: https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPOSITORY.git
    targetRevision: REPLACE_IMMUTABLE_VALUES_COMMIT
    ref: values
  destination:
    server: https://REPLACE_STAGING_EKS_API_SERVER
    namespace: cert-manager
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    - PruneLast=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
  revisionHistoryLimit: 10
