apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asteriq-control-plane
  namespace: argocd
spec:
  project: asteriq-control-plane
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPOSITORY.git
    targetRevision: main
    path: applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
