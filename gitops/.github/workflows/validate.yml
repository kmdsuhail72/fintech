name: Validate GitOps desired state
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
      GITOPS_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: trusted-policy
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Install safe YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate with protected-main policy rather than PR-modified code
        run: >-
          python trusted-policy/automation/validate.py --root candidate --initialized
          --verify-tags --app-repository "$APP_REPOSITORY" --gitops-repository "$GITOPS_REPOSITORY"
