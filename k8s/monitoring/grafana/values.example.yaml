replicas: 2
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
persistence:
  enabled: false
env:
  GF_DATABASE_TYPE: postgres
envValueFrom:
  GF_DATABASE_HOST:
    secretKeyRef:
      name: grafana-database
      key: host
  GF_DATABASE_NAME:
    secretKeyRef:
      name: grafana-database
      key: database
  GF_DATABASE_USER:
    secretKeyRef:
      name: grafana-database
      key: username
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-database
      key: password
  GF_DATABASE_SSL_MODE:
    secretKeyRef:
      name: grafana-database
      key: sslmode
service:
  type: ClusterIP
ingress:
  enabled: false
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
  datasources:
    enabled: true
    label: grafana_datasource
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 512Mi
