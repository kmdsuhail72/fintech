apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    grafana_datasource: '1'
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n- name: Prometheus\n  uid: prometheus\n\
    \  type: prometheus\n  access: proxy\n  url: http://asteriq-monitoring-prometheus.monitoring.svc.cluster.local:9090\n\
    \  isDefault: true\n- name: Loki\n  uid: loki\n  type: loki\n  access: proxy\n\
    \  url: http://loki-gateway.monitoring.svc.cluster.local\n  jsonData:\n    httpHeaderName1:\
    \ X-Scope-OrgID\n  secureJsonData:\n    httpHeaderValue1: asteriq\n"
