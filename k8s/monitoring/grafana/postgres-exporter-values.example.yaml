replicaCount: 1
config:
  datasourceSecret:
    name: postgres-exporter
    key: uri
  disableSettingsMetrics: false
  disableDefaultMetrics: false
serviceMonitor:
  enabled: true
  labels:
    asteriq.ai/monitoring: enabled
  interval: 30s
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
extraVolumes:
  - name: rds-ca
    configMap:
      name: rds-ca
extraVolumeMounts:
  - name: rds-ca
    mountPath: /etc/rds-ca
    readOnly: true
