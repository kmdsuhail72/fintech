rule_files:
  - asteriq-alerts.rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: asteriq_http_requests_total{namespace="asteriq-production",operation="core",status="200"}
        values: 0+560x20
      - series: asteriq_http_requests_total{namespace="asteriq-production",operation="core",status="500"}
        values: 0+40x20
    alert_rule_test:
      - eval_time: 12m
        alertname: AsteriqAPI5xxCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              service: api
              alert_family: api-errors
              owner: asteriq
              namespace: asteriq-production
            exp_annotations:
              summary: API 5xx ratio exceeds 5%
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series:
      - series: asteriq_http_requests_total{namespace="asteriq-production",operation="core",status="200"}
        values: 0+590x20
      - series: asteriq_http_requests_total{namespace="asteriq-production",operation="core",status="500"}
        values: 0+10x20
    alert_rule_test:
      - eval_time: 12m
        alertname: AsteriqAPI5xxCritical
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: asteriq_http_requests_total{namespace="asteriq-production",operation="core",status="200"}
        values: 0+1x20
      - series: asteriq_http_requests_total{namespace="asteriq-production",operation="core",status="500"}
        values: 0+1x20
    alert_rule_test:
      - eval_time: 12m
        alertname: AsteriqAPI5xxCritical
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: asteriq_http_request_duration_seconds_bucket{namespace="asteriq-production",operation="core",le="0.5"}
        values: 0+0x30
      - series: asteriq_http_request_duration_seconds_bucket{namespace="asteriq-production",operation="core",le="1"}
        values: 0+0x30
      - series: asteriq_http_request_duration_seconds_bucket{namespace="asteriq-production",operation="core",le="2"}
        values: 0+10x30
      - series: asteriq_http_request_duration_seconds_bucket{namespace="asteriq-production",operation="core",le="+Inf"}
        values: 0+10x30
    alert_rule_test:
      - eval_time: 15m
        alertname: AsteriqAPILatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
              alert_family: api-latency
              owner: asteriq
              namespace: asteriq-production
            exp_annotations:
              summary: API p95 exceeds 1 second (includes research)
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series:
      - series: kube_deployment_spec_replicas{namespace="asteriq-production",deployment="ai-service"}
        values: 3+0x10
    alert_rule_test:
      - eval_time: 4m
        alertname: AsteriqAIUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: ai-service
              alert_family: ai-availability
              owner: asteriq
              namespace: asteriq-production
            exp_annotations:
              summary: No healthy discovered AI service scrape target
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series:
      - series: asteriq_redis_healthy{namespace="asteriq-production"}
        values: 0+0x10
    alert_rule_test:
      - eval_time: 3m
        alertname: AsteriqRedisUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: redis
              alert_family: redis-availability
              owner: asteriq
              namespace: asteriq-production
            exp_annotations:
              summary: API Redis probe failed
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series:
      - series: kube_pod_container_status_restarts_total{namespace="asteriq-production",pod="api-1",container="api"}
        values: 0+1x15
      - &id001
        series: kube_pod_info{namespace="asteriq-production",pod="api-1",node="worker-1"}
        values: 1+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: AsteriqPodRestartsIncreasing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: kubernetes
              alert_family: pod-restarts
              owner: asteriq
              namespace: asteriq-production
              pod: api-1
              container: api
              node: worker-1
            exp_annotations:
              summary: Pod container restart count is increasing
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series:
      - series: kube_pod_container_status_waiting_reason{namespace="asteriq-production",pod="api-1",container="api",reason="CrashLoopBackOff"}
        values: 1+0x15
      - *id001
    alert_rule_test:
      - eval_time: 4m
        alertname: AsteriqPodCrashLoopBackOff
        exp_alerts:
          - exp_labels:
              severity: critical
              service: kubernetes
              alert_family: pod-crashloop
              owner: asteriq
              namespace: asteriq-production
              pod: api-1
              container: api
              reason: CrashLoopBackOff
              node: worker-1
            exp_annotations:
              summary: Pod is in CrashLoopBackOff
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series:
      - series: pg_stat_database_numbackends{job="postgres",instance="db:9187",datname="asteriq"}
        values: 95+0x10
      - series: pg_settings_max_connections{job="postgres",instance="db:9187"}
        values: 100+0x10
    alert_rule_test:
      - eval_time: 6m
        alertname: AsteriqPostgresConnectionsCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              service: postgres
              alert_family: postgres-connections
              owner: asteriq
              job: postgres
              instance: db:9187
            exp_annotations:
              summary: PostgreSQL connection utilization exceeds 90%
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series:
      - series: kube_node_status_condition{node="worker-1",condition="Ready",status="true"}
        values: 0+0x10
    alert_rule_test:
      - eval_time: 6m
        alertname: AsteriqNodeUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: kubernetes
              alert_family: node-availability
              owner: asteriq
              node: worker-1
              condition: Ready
              status: 'true'
            exp_annotations:
              summary: Kubernetes node is not Ready
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series:
      - series: asteriq_failed_orders_total{namespace="asteriq-production"}
        values: 0+0x5 0+3x15
    alert_rule_test:
      - eval_time: 12m
        alertname: AsteriqTradingFailuresIncreasing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
              alert_family: trade-errors
              owner: asteriq
              namespace: asteriq-production
            exp_annotations:
              summary: Failed trading requests are increasing
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series:
      - series: nginx_ingress_controller_requests{namespace="asteriq-production",status="500"}
        values: 0+0x5 0+30x15
    alert_rule_test:
      - eval_time: 10m
        alertname: AsteriqIngressErrorsIncreasing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: ingress
              alert_family: ingress-errors
              owner: asteriq
              namespace: asteriq-production
            exp_annotations:
              summary: Ingress 5xx request rate increased more than twofold
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series:
      - series: node_cpu_seconds_total{instance="worker:9100",mode="idle",cpu="0"}
        values: 0+6x25
    alert_rule_test:
      - eval_time: 16m
        alertname: AsteriqNodeCPUWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              service: kubernetes
              alert_family: node-cpu
              owner: asteriq
              instance: worker:9100
            exp_annotations:
              summary: Node CPU exceeds 80%
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series:
      - series: node_memory_MemAvailable_bytes{instance="worker:9100"}
        values: 10+0x20
      - series: node_memory_MemTotal_bytes{instance="worker:9100"}
        values: 100+0x20
    alert_rule_test:
      - eval_time: 12m
        alertname: AsteriqNodeMemoryWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              service: kubernetes
              alert_family: node-memory
              owner: asteriq
              instance: worker:9100
            exp_annotations:
              summary: Node memory exceeds 85%
              description: Check the Asteriq service dashboard and alerting runbook; inspect
                dependency health and recent releases.
  - interval: 1m
    input_series: &id002
      - series: aws_applicationelb_request_count_sum{load_balancer="app/asteriq/123"}
        values: 1000+0x20
      - series: aws_applicationelb_httpcode_elb_5_xx_count_sum{load_balancer="app/asteriq/123"}
        values: 1+0x5 60+0x15
    alert_rule_test:
      - eval_time: 9m
        alertname: AsteriqALBErrorsIncreasing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: ingress
              alert_family: ingress-errors
              owner: asteriq
              load_balancer: app/asteriq/123
            exp_annotations:
              summary: ALB/target 5xx ratio increased more than twofold
              description: CloudWatch five-minute Sum gauges, with bounded ALB dimension
                selection; verify exporter freshness.
  - interval: 1m
    input_series: *id002
    alert_rule_test:
      - eval_time: 12m
        alertname: AsteriqALBErrorsCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              service: ingress
              alert_family: ingress-errors
              owner: asteriq
              load_balancer: app/asteriq/123
            exp_annotations:
              summary: ALB/target 5xx ratio exceeds 5%
              description: CloudWatch five-minute Sum gauges, with bounded ALB dimension
                selection; verify exporter freshness.
