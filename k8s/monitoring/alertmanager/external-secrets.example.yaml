apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asteriq-alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_MONITORING_SECRET_STORE
    kind: SecretStore
  target:
    name: asteriq-alertmanager-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: alertmanager.yaml
      remoteRef:
        key: REPLACE_ALERTMANAGER_SECRET_ARN
        property: alertmanager_yaml
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asteriq-notification-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_MONITORING_SECRET_STORE
    kind: SecretStore
  target:
    name: asteriq-notification-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: smtp-password
      remoteRef:
        key: REPLACE_ALERTMANAGER_SECRET_ARN
        property: smtp_password
    - secretKey: slack-webhook
      remoteRef:
        key: REPLACE_ALERTMANAGER_SECRET_ARN
        property: slack_webhook
