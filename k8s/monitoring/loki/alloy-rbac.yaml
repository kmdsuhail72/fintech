apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: asteriq-alloy-pod-logs
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - pods/log
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: asteriq-alloy-pod-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: asteriq-alloy-pod-logs
subjects:
  - kind: ServiceAccount
    name: asteriq-alloy
    namespace: monitoring
