apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: asteriq-slo
  namespace: monitoring
  labels:
    asteriq.ai/monitoring: enabled
spec:
  groups:
  - name: asteriq.slo.recording
    interval: 1m
    rules:
    - record: asteriq:slo_bad_ratio:5m
      expr: clamp_max(clamp_min(((sum by(namespace)(increase(asteriq_http_requests_total{namespace=~"asteriq-(dev|staging|production)",operation!="health",method!="OPTIONS",status=~"429|499|5.."}[5m]))
        or on(namespace) (0 * sum by(namespace)(increase(asteriq_http_requests_total{namespace=~"asteriq-(dev|staging|production)",operation!="health",method!="OPTIONS",status=~"[23]..|429|499|5.."}[5m]))))
        / sum by(namespace)(increase(asteriq_http_requests_total{namespace=~"asteriq-(dev|staging|production)",operation!="health",method!="OPTIONS",status=~"[23]..|429|499|5.."}[5m]))),
        0), 1)
      labels: &id001
        slo: api-availability
        service: api
    - record: asteriq:slo_burn_rate:5m
      expr: asteriq:slo_bad_ratio:5m{slo="api-availability"} / 0.001000
      labels: *id001
    - record: asteriq:slo_bad_ratio:30m
      expr: clamp_max(clamp_min(((sum by(namespace)(increase(asteriq_http_requests_total{namespace=~"asteriq-(dev|staging|production)",operation!="health",method!="OPTIONS",status=~"429|499|5.."}[30m]))
        or on(namespace) (0 * sum by(namespace)(increase(asteriq_http_requests_total{namespace=~"asteriq-(dev|staging|production)",operation!="health",method!="OPTIONS",status=~"[23]..|429|499|5.."}[30m]))))
        / sum by(namespace)(increase(asteriq_http_requests_total{namespace=~"asteriq-(dev|staging|production)",operation!="health",method!="OPTIONS",status=~"[23]..|429|499|5.."}[30m]))),
        0), 1)
      labels: *id001
    - record: asteriq:slo_burn_rate:30m
      expr: asteriq:slo_bad_ratio:30m{slo="api-availability"} / 0.001000
      labels: *id001
    - record: asteriq:slo_bad_ratio:1h
      expr: clamp_max(clamp_min(((sum by(namespace)(increase(asteriq_http_requests_total{namespace=~"asteriq-(dev|staging|production)",operation!="health",method!="OPTIONS",status=~"429|499|5.."}[1h]))
        or on(namespace) (0 * sum by(namespace)(increase(asteriq_http_requests_total{namespace=~"asteriq-(dev|staging|production)",operation!="health",method!="OPTIONS",status=~"[23]..|429|499|5.."}[1h]))))
        / sum by(namespace)(increase(asteriq_http_requests_total{namespace=~"asteriq-(dev|staging|production)",operation!="health",method!="OPTIONS",status=~"[23]..|429|499|5.."}[1h]))),
        0), 1)
      labels: *id001
    - record: asteriq:slo_burn_rate:1h
