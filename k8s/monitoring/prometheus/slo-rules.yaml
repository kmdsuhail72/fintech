  - name: asteriq.slo.alerts
    rules:
    - alert: AsteriqSLOBurnFast
      expr: (asteriq:slo_burn_rate:1h > 14.4) and on(namespace,service,slo) (asteriq:slo_burn_rate:5m
        > 14.4)
      for: 2m
      labels:
        severity: critical
        alert_family: slo-burn
      annotations:
        summary: '{{ $labels.slo }} error budget is burning'
        description: Both 1h and 5m exceed 14.4x burn. Page; acknowledge within 5
          minutes. Inspect the SLO dashboard and confirm customer impact.
        runbook_url: https://github.com/REPLACE_OWNER/REPLACE_REPO/blob/main/k8s/monitoring/slo/README.md
    - alert: AsteriqSLOBurnSustained
      expr: (asteriq:slo_burn_rate:6h > 6) and on(namespace,service,slo) (asteriq:slo_burn_rate:30m
        > 6)
      for: 2m
      labels:
        severity: critical
        alert_family: slo-burn
      annotations:
        summary: '{{ $labels.slo }} error budget is burning'
        description: Both 6h and 30m exceed 6x burn. Page; acknowledge within 5 minutes.
          Inspect the SLO dashboard and confirm customer impact.
        runbook_url: https://github.com/REPLACE_OWNER/REPLACE_REPO/blob/main/k8s/monitoring/slo/README.md
    - alert: AsteriqSLOBurnSlow
      expr: (asteriq:slo_burn_rate:1d > 3) and on(namespace,service,slo) (asteriq:slo_burn_rate:2h
        > 3)
      for: 2m
      labels:
        severity: warning
        alert_family: slo-burn
      annotations:
        summary: '{{ $labels.slo }} error budget is burning'
        description: Both 1d and 2h exceed 3x burn. Create incident ticket; triage
          within 4 hours. Inspect the SLO dashboard and confirm customer impact.
        runbook_url: https://github.com/REPLACE_OWNER/REPLACE_REPO/blob/main/k8s/monitoring/slo/README.md
    - alert: AsteriqSLOBurnPersistent
      expr: (asteriq:slo_burn_rate:3d > 1) and on(namespace,service,slo) (asteriq:slo_burn_rate:6h
        > 1)
      for: 2m
      labels:
        severity: info
        alert_family: slo-burn
      annotations:
        summary: '{{ $labels.slo }} error budget is burning'
        description: Both 3d and 6h exceed 1x burn. Review within one business day.
          Inspect the SLO dashboard and confirm customer impact.
        runbook_url: https://github.com/REPLACE_OWNER/REPLACE_REPO/blob/main/k8s/monitoring/slo/README.md
    - alert: AsteriqSLOBudgetExhausted
      expr: asteriq:slo_budget_remaining:ratio <= 0
      for: 15m
      labels:
        severity: warning
        alert_family: slo-budget
      annotations:
        summary: '{{ $labels.slo }} 30-day error budget exhausted'
        description: Freeze risk-increasing releases; prioritize reliability recovery.
          Validate coverage before declaring compliance.
