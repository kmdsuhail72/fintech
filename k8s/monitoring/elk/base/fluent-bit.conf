[SERVICE]
    Flush 5
    Log_Level warn
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    storage.path /buffers/chunks
    storage.sync normal
    storage.checksum On
    storage.backlog.mem_limit 16M

[INPUT]
    Name tail
    Path /var/log/containers/*.log
    Tag kube.*
    multiline.parser docker, cri
    DB /buffers/tail.db
    DB.Sync Normal
    Mem_Buf_Limit 32MB
    Skip_Long_Lines On
    Read_from_Head Off
    Refresh_Interval 5
    storage.type filesystem

[FILTER]
    Name kubernetes
    Match kube.*
    Kube_URL https://kubernetes.default.svc:443
    Kube_Tag_Prefix kube.var.log.containers.
    Merge_Log On
    Merge_Log_Key application
    Keep_Log On
    Labels On
    Annotations Off
    K8S-Logging.Parser Off
    K8S-Logging.Exclude Off
    tls.verify On

[FILTER]
    Name lua
    Match kube.*
    script /fluent-bit/config/normalize.lua
    call normalize
    protected_mode On

[OUTPUT]
    Name es
    Match kube.*
    Host asteriq-logs-es-http.monitoring.svc
    Port 9200
    HTTP_User ${ES_LOG_USER}
    HTTP_Passwd ${ES_LOG_PASSWORD}
    tls On
    tls.verify On
    tls.verify_hostname On
    tls.ca_file /es-ca/ca.crt
    Logstash_Format On
    Logstash_Prefix asteriq-unknown-application
    Logstash_Prefix_Key $es_index_prefix
    Time_Key @timestamp
    Generate_ID On
    Write_Operation create
    Suppress_Type_Name On
    Retry_Limit False
    storage.total_limit_size 2G
    Trace_Error Off
    Trace_Output Off
