input { http { port => 8080 codec => json } }
filter { mutate { remove_field => ["authorization", "password", "token"] } }
output {
  elasticsearch {
    hosts => ["https://asteriq-logs-es-http.monitoring.svc.cluster.local:9200"]
    user => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/etc/elastic-ca/ca.crt"]
    index => "asteriq-logs-%{+YYYY.MM.dd}"
  }
}
