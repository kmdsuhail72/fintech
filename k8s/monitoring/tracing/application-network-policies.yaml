apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-traces-egress
  namespace: asteriq-dev
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - api
          - ai-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: asteriq-otel
      ports:
        - protocol: TCP
          port: 4318
---
