apiVersion: batch/v1
kind: Job
metadata:
  name: asteriq-migration-REPLACE_RELEASE
  namespace: asteriq-production
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration
        app.kubernetes.io/part-of: asteriq
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      serviceAccountName: migration
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: REPLACE_SCANNED_API_IMAGE_DIGEST
          command:
            - node
            - /workspace/scripts/migrate.mjs
          envFrom:
            - secretRef:
                name: migration-secrets
          env:
            - name: RUN_MIGRATIONS
              value: 'false'
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/rds-ca/global-bundle.pem
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca
