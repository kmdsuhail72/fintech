# Merge after production platform values. Supply the real issued regional ARN.
asteriq-web:
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/load-balancer-name: asteriq-production-https
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/certificate-arn: REPLACE_ISSUED_REGIONAL_ACM_CERTIFICATE_ARN
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/healthcheck-path: /health
      alb.ingress.kubernetes.io/success-codes: '200'
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=180,routing.http.drop_invalid_header_fields.enabled=true,deletion_protection.enabled=true
      alb.ingress.kubernetes.io/listener-attributes.HTTPS-443: routing.http.response.strict_transport_security.header_value=max-age=31536000
      alb.ingress.kubernetes.io/inbound-cidrs: 0.0.0.0/0
    hosts:
      - host: app.asteriq.ai
        paths:
          - path: /
            pathType: Prefix
      - host: api.asteriq.ai
        paths:
          - path: /api/v1
            pathType: Prefix
          - path: /socket.io
            pathType: Prefix
    tls:
      - hosts: [app.asteriq.ai, api.asteriq.ai]
asteriq-api:
  ingress:
    enabled: false
  env:
    CORS_ORIGINS: https://app.asteriq.ai
    AUTH_WEB_URL: https://app.asteriq.ai
    TRUST_PROXY_HOPS: '2'
asteriq-ai-service:
  ingress:
    enabled: false
