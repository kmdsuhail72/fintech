            cidr: REPLACE_DATA_SUBNET_1_CIDR
        - ipBlock:
            cidr: REPLACE_DATA_SUBNET_2_CIDR
        - ipBlock:
            cidr: REPLACE_DATA_SUBNET_3_CIDR
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
