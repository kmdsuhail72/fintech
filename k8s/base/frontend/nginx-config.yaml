apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
data:
  nginx.conf.template: "worker_processes auto;\npid /tmp/nginx.pid;\nerror_log /dev/stderr\
    \ warn;\nevents { worker_connections 2048; }\nhttp {\ninclude /etc/nginx/mime.types;\n\
    log_format asteriq_json escape=json '{\"timestamp\":\"$time_iso8601\",\"level\"\
    :\"info\",\"service\":\"web\",\"environment\":null,\"namespace\":null,\"pod\"\
    :null,\"request_id\":\"$request_id\",\"trace_id\":\"$upstream_http_x_trace_id\"\
    ,\"user_safe_identifier\":null,\"endpoint\":\"$asteriq_endpoint\",\"status_code\"\
    :$status,\"event\":\"http_request\",\"method\":\"$request_method\",\"durationSeconds\"\
    :$request_time,\"upstreamSeconds\":\"$upstream_response_time\"}';\nmap $uri $asteriq_endpoint\
    \ {\n  ~^/api/ \"/api/*\";\n  ~^/socket.io/ \"/socket.io/*\";\n  /health \"/health\"\
    ;\n  default \"web\";\n}\n\nmap $http_upgrade $connection_upgrade {\n  default\
    \ upgrade;\n  '' close;\n}\nmap $http_x_forwarded_proto $forwarded_proto {\n \
    \ default $http_x_forwarded_proto;\n  '' $scheme;\n}\nserver {\n  access_log /dev/stdout\
    \ asteriq_json;\n  listen 8080;\n  server_name _;\n  root /usr/share/nginx/html;\n\
    \  client_body_temp_path /tmp/client;\n  proxy_temp_path /tmp/proxy;\n  fastcgi_temp_path\
    \ /tmp/fastcgi;\n  uwsgi_temp_path /tmp/uwsgi;\n  scgi_temp_path /tmp/scgi;\n\
    \  index index.html;\n  client_max_body_size 10m;\n  resolver __ASTERIQ_DNS_RESOLVER__\
    \ valid=10s ipv6=off;\n  set $api_upstream __ASTERIQ_API_UPSTREAM__;\n\n  location\
    \ /api/ {\n    proxy_pass $api_upstream$request_uri;\n    proxy_set_header Host\
    \ $host;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For\
    \ $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $forwarded_proto;\n\
    \    proxy_connect_timeout 5s;\n    proxy_read_timeout 190s;\n    proxy_send_timeout\
    \ 190s;\n  }\n  location /socket.io/ {\n    proxy_pass $api_upstream$request_uri;\n\
    \    proxy_http_version 1.1;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \    proxy_set_header X-Forwarded-Proto $forwarded_proto;\n    proxy_set_header\
    \ Upgrade $http_upgrade;\n    proxy_set_header Connection $connection_upgrade;\n\
    \    proxy_set_header Host $host;\n    proxy_read_timeout 90s;\n  }\n  location\
    \ /health {\n    access_log off;\n    default_type text/plain;\n    return 200\
    \ \"ok\\n\";\n  }\n  location / { try_files $uri $uri/ /index.html; }\n}\n\n}\n"
