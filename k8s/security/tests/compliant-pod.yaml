apiVersion: v1
kind: Pod
metadata:
  name: compliant-api
  namespace: asteriq-production
spec:
  serviceAccountName: api
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: api
      image: 000000000000.dkr.ecr.ap-south-1.amazonaws.com/asteriq-production-eks/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 500m, memory: 512Mi}
        limits: {cpu: '2', memory: 1Gi}
