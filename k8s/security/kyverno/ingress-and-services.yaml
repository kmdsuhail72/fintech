apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: asteriq-ingress-tls
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [ingresses]
  matchConditions:
    - name: asteriq-production
      expression: "has(object.metadata.namespace) && object.metadata.namespace == 'asteriq-production'"
  validations:
    - message: Production Ingress must use ALB, an ACM certificate and HTTPS, with HTTP redirect when port 80 is present.
      expression: >-
        has(object.spec.ingressClassName) && object.spec.ingressClassName == 'alb'
        && has(object.metadata.annotations)
        && 'alb.ingress.kubernetes.io/certificate-arn' in object.metadata.annotations
        && object.metadata.annotations['alb.ingress.kubernetes.io/certificate-arn'].matches('^arn:aws:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+$')
        && 'alb.ingress.kubernetes.io/listen-ports' in object.metadata.annotations
        && object.metadata.annotations['alb.ingress.kubernetes.io/listen-ports'] in ['[{"HTTPS":443}]', '[{"HTTP":80},{"HTTPS":443}]']
        && (!object.metadata.annotations['alb.ingress.kubernetes.io/listen-ports'].contains('"HTTP":80')
            || ('alb.ingress.kubernetes.io/ssl-redirect' in object.metadata.annotations && object.metadata.annotations['alb.ingress.kubernetes.io/ssl-redirect'] == '443'))
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: asteriq-private-services
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  matchConditions:
    - name: asteriq-production
      expression: "has(object.metadata.namespace) && object.metadata.namespace == 'asteriq-production'"
  validations:
    - message: Application Services must remain ClusterIP; use the approved frontend Ingress for public traffic.
      expression: "(!has(object.spec.type) || object.spec.type == 'ClusterIP') && (!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0)"
