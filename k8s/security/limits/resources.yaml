apiVersion: v1
kind: ResourceQuota
metadata:
  name: asteriq-production-budget
spec:
  hard:
    requests.cpu: '64'
    requests.memory: 96Gi
    limits.cpu: '128'
    limits.memory: 192Gi
    pods: '80'
    count/secrets: '20'
    count/persistentvolumeclaims: '10'
    requests.storage: 300Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: asteriq-container-bounds
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 32Mi
      max:
        cpu: '4'
        memory: 8Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: '1'
        memory: 1Gi
