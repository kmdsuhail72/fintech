apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
  namespace: asteriq-production
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_SECRETS_IRSA_ROLE_ARN
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: asteriq-production
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: secrets-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: asteriq-production
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: {name: aws-secrets, kind: SecretStore}
  target: {name: api-secrets, creationPolicy: Owner
    deletionPolicy: Retain}
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: asteriq-production/database-url}
    - secretKey: REDIS_URL
      remoteRef: {key: asteriq-production/redis-url}
    - secretKey: JWT_ACCESS_SECRET
      remoteRef: {key: asteriq-production/jwt}
    - secretKey: SMTP_URL
      remoteRef: {key: asteriq-production/smtp}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-service-secrets
  namespace: asteriq-production
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: {name: aws-secrets, kind: SecretStore}
  target: {name: ai-service-secrets, creationPolicy: Owner
    deletionPolicy: Retain}
  data:
    - secretKey: RAG_DATABASE_URL
      remoteRef: {key: asteriq-production/rag-database-url}
    - secretKey: OPENAI_API_KEY
      remoteRef: {key: asteriq-production/openai}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: migration-secrets
  namespace: asteriq-production
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: {name: aws-secrets, kind: SecretStore}
  target: {name: migration-secrets, creationPolicy: Owner
    deletionPolicy: Retain}
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: asteriq-production/migration-database-url}
